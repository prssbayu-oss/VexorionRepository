<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexorion</title>

    <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
    <link rel="stylesheet" href="styles/Vexorion.css">
</head>
<body>
    <main class="vexorion-class-container">

        <img src="assets/logo/logo.svg"
             alt="Vexorion"
             class="vexorion-class-logo">

        <h1 id="vexorion-id-title">Original Title</h1>
        <p id="vexorion-id-output">Waiting...</p>

        <button id="vexorion-id-load-data">
            <img src="assets/icons/bolt.svg"
                 alt=""
                 class="vexorion-class-icon"
                 width="20"
                 height="20">
            <span>Load Data</span>
        </button>

        <ul id="vexorion-id-user-list"></ul>

        <div id="vexorion-id-empty-state" class="vexorion-class-empty">
            <img src="assets/illustrations/empty-state.svg"
                 alt="No data"
                 width="200">
        </div>

    </main>

    <script type="module" src="scripts/index.js"></script>
</body>
</html>
